{% extends 'base.html' %}

{% block head %}
<script src="{{url_for('static',filename='js/move.js')}}" defer></script>
<style>
body {
  overflow: hidden;
}

.box {
  position: absolute;
  width: 80px;
  height: 80px;
  background: crimson;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.controls {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  z-index: 100;
}

button {
  padding: 12px 24px;
  background: #00ff88;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #00cc6f;
}
</style>
{% endblock %}

{% block body %}
<div id="box1" class="box" style="left: 50px; top: 50px;">Box 1</div>
<div id="box2" class="box" style="left: 200px; top: 50px;">Box 2</div>

<div class="controls">
  <button onclick="testMoveToPosition()">Move Box 1 to Center</button>
  <button onclick="testMoveOffscreen()">Move Box 2 Off-screen</button>
</div>

<script>
const box1 = document.getElementById('box1');
const box2 = document.getElementById('box2');

function testMoveToPosition() {
  const centerX = window.innerWidth / 2 - 40;
  const centerY = window.innerHeight / 2 - 40;
  moveToPosition(box1, centerX, centerY, 1000);
}

function testMoveOffscreen() {
  moveUntilOffscreen(box2, 1, 0.5, 5);
}
</script>
{% endblock %}
