{% extends 'base.html' %}

{% block head %}
<style>
#glitch-text {
  font-family: 'Courier New', Courier, monospace; /* ensures every character has equal width */
  font-size: 2rem;
  color: white;
  text-shadow: 0 0 5px rgba(255, 0, 255, 0.7),
               0 0 10px rgba(0, 255, 255, 0.7);
  letter-spacing: 2px; /* optional: adds spacing for a digital feel */
  transition: color 0.3s ease;
  background: black;
  padding: 20px;
  display: inline-block;
}
</style>
{% endblock %}

{% block body %}
<h1 id="glitch-text">THE TRUTH IS HIDDEN</h1>

<script>
const glitchElement = document.getElementById("glitch-text");
const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
const originalText = glitchElement.textContent;

// Keep a copy of the text so multiple glitches can happen at once
let currentText = originalText.split("");

function randomGlitchSwap() {
  const index = Math.floor(Math.random() * currentText.length);
  const originalChar = originalText[index]; // original character for this position
  const randomChar = chars[Math.floor(Math.random() * chars.length)];

  // If it's already glitched, do nothing
  if (currentText[index] !== originalChar) return;

  // Replace one character with a random one
  currentText[index] = randomChar;
  glitchElement.textContent = currentText.join("");

  // Restore this single character after a delay
  setTimeout(() => {
    currentText[index] = originalChar;
    glitchElement.textContent = currentText.join("");
  }, 600); // restore after 150ms
}

// Run the glitch randomly
setInterval(() => {
  randomGlitchSwap();
}, Math.floor(Math.random() * 200) + 100);

</script>
